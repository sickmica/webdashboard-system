<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 库存管理系统</title>
  <link rel="icon" type="image/svg+xml" href="icon/管理.svg">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #102a43;
      --text-muted: #627d98;
      --border-color: #bcccdc;
      --input-bg: #ffffff;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* Background decoration */
    .bg-decoration {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background-color: #f0f4f8;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 20s infinite alternate ease-in-out;
    }
    .circle-1 { width: 500px; height: 500px; background: #818cf8; top: -150px; right: -100px; animation-delay: 0s; }
    .circle-2 { width: 450px; height: 450px; background: #c084fc; bottom: -100px; left: -150px; animation-delay: -5s; }
    .circle-3 { width: 350px; height: 350px; background: #38bdf8; top: 40%; left: 60%; opacity: 0.2; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
      100% { transform: translate(-20px, 20px) scale(0.9); }
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .input-field {
      width: 100%;
      height: 44px;
      padding: 0 12px 0 40px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: var(--primary-hover);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="header">
        <div class="logo-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <h1>库存管理系统</h1>
        <p>请登录您的账号</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">账号</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="email" id="email" class="input-field" placeholder="请输入邮箱地址" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <div class="input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="input-field" placeholder="请输入您的密码" required autocomplete="current-password">
          </div>
        </div>

        <div class="options">
          <label class="remember-me">
            <input type="checkbox" id="rememberPwd" checked>
            记住密码
          </label>
        </div>

        <button type="submit" id="loginBtn" class="login-btn">登录</button>
        <div id="error" class="error-msg"></div>
      </form>

      <div class="footer">
        &copy; 2026 库存管理系统 · 安全访问
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCliFpgd9s25NMnN9aC_zcUVEa_LYXsclo",
      authDomain: "laptop-repair-system-ab5cb.firebaseapp.com",
      projectId: "laptop-repair-system-ab5cb",
    };
    let app = null;
    let auth = null;
    let isLoggingIn = false;
    function init() {
      try {
        if (firebase && (!firebase.apps || !firebase.apps.length)) {
          app = firebase.initializeApp(firebaseConfig);
        } else {
          app = firebase.app();
        }
        auth = firebase.auth();
        auth.onAuthStateChanged((user) => {
          if (user && !isLoggingIn) {
            location.href = 'webdashboard.html';
          }
        });
      } catch (e) {
        document.getElementById('error').textContent = '初始化失败，请刷新重试';
      }
    }
    function showError(msg) {
      document.getElementById('error').textContent = msg || '';
    }
    async function login() {
      showError('');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = '登录中...';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberPwd')?.checked;
      try {
        isLoggingIn = true;
        if (remember && auth && firebase?.auth?.Auth?.Persistence?.LOCAL) {
          await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        }
        await auth.signInWithEmailAndPassword(email, password);
        await storeCredentialsIfNeeded(email, password);
        location.href = 'webdashboard.html';
      } catch (err) {
        let msg = '登录失败';
        if (err && err.code) {
          const map = {
            'auth/invalid-email': '邮箱格式不正确',
            'auth/user-disabled': '账户已被禁用',
            'auth/user-not-found': '用户不存在',
            'auth/wrong-password': '密码错误'
          };
          msg = map[err.code] || (err.message || msg);
        }
        showError(msg);
      } finally {
        btn.disabled = false; btn.textContent = '登录';
        isLoggingIn = false;
      }
    }
    async function storeCredentialsIfNeeded(email, password) {
      try {
        const remember = document.getElementById('rememberPwd')?.checked;
        if (!remember) return;
        if ('credentials' in navigator) {
          if (window.PasswordCredential) {
            const cred = new PasswordCredential({ id: email, password });
            await navigator.credentials.store(cred);
          } else if (navigator.credentials.store) {
            // Some browsers support FederatedCredential only; ignore silently
          }
        }
      } catch {}
    }
    async function tryAutofill() {
      try {
        if ('credentials' in navigator) {
          const cred = await navigator.credentials.get({ password: true, mediation: 'silent' });
          if (cred && cred.id && cred.password) {
            const emailEl = document.getElementById('email');
            const pwdEl = document.getElementById('password');
            if (emailEl && !emailEl.value) emailEl.value = cred.id;
            if (pwdEl && !pwdEl.value) pwdEl.value = cred.password;
          }
        }
      } catch {}
    }
    document.getElementById('loginBtn').addEventListener('click', async (e) => { e.preventDefault(); await login(); await storeCredentialsIfNeeded(); });
    document.getElementById('loginForm').addEventListener('submit', async (e) => { e.preventDefault(); await login(); await storeCredentialsIfNeeded(); });
    tryAutofill(); init();
  </script>
</body>
</html>
